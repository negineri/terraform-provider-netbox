# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
    paths-ignore:
      - 'README.md'
  # PR のブランチは pull_request で流れるので、push は main だけにする
  # (両方で流すと同じコミットのテストが同じ NetBox に 2 本ずつ走る)
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      # We need the latest version of Terraform for our documentation generation to use
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    name: 'Acceptance Tests: Terraform ${{ matrix.terraform }} / NetBox ${{ matrix.netbox }}'
    # build (lint を含めて約 1 分) を待たずに始める。コンパイルできなければここでも落ちる
    runs-on: ubuntu-latest
    # テストは固定の IP アドレス (192.168.60.1/24 など) を作るので、同じ NetBox に
    # 2 本流れると "Duplicate IP address" でぶつかる。NetBox のバージョンごとに 1 本ずつにする
    # (実行中のものは止めず、後から来たものを待たせる)
    concurrency:
      group: acceptance-tests-netbox-${{ matrix.netbox }}
      cancel-in-progress: false
    timeout-minutes: 15
    environment: 
      name: dev
    strategy:
      fail-fast: false
      # NetBox はバージョンごとに別のサーバーなので、同じ Terraform のジョブ同士は並べてよい
      max-parallel: 3
      matrix:
        # Terraform versions
        terraform:
          # - '1.13.*'
          - '1.14.*'
        # NetBox versions. negineri/ansible-witenp の nbci-v4-* (setup_netbox_ci) が
        # https://netbox-ci-v4-7.witenp.com/ のようにマイナーバージョンごとに 1 台ずつ立てている
        netbox:
          - '4.5'
          - '4.6'
          - '4.7'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - name: Select NetBox server
        env:
          NETBOX_VERSION: ${{ matrix.netbox }}
        run: echo "NETBOX_SERVER_URL=https://netbox-ci-v${NETBOX_VERSION//./-}.witenp.com" >> "$GITHUB_ENV"
      - env:
          TF_ACC: "1"
          NETBOX_TOKEN_V2: ${{ secrets.NETBOX_TOKEN_V2 }}
          NETBOX_KEY_V2: ${{ secrets.NETBOX_KEY_V2 }}
        # runner は 4 vCPU なので既定の並列度は 4。テストは NetBox の応答待ちが大半なので広げる
        run: go test -v -cover -parallel 16 ./internal/provider/
        timeout-minutes: 10
